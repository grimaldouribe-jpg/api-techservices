# TechServices Peru: ejercicio 1 (Spring Boot y MySQL)
spring.application.name=api-techservices
server.port=${PORT:8081}
# Local: XAMPP en puerto 3306. En Render definir DB_URL, DB_USER y DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/bd_techservices?useUnicode=true&characterEncoding=UTF-8}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# La base de datos se crea con el script SQL; Spring Boot no modifica las tablas.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Evitar exposicion de datos de credenciales en los logs.
spring.jpa.show-sql=false
